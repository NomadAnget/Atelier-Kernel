[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-sdk"
dynamic = ["version"]
description = "Official Python Domain SDK for Atelier Kernel (named-endpoint IPC, 4-stage receipts, C4 virtual files)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Atelier Kernel Team" }
]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "atelier_sdk.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["atelier_sdk*"]
