name: Build SDKs & Kernel Runtime Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  ci-test:
    name: Fast CI Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Kernel Unit & Integration Tests
        run: cargo test

      # 文档漂移门禁：只做可判定断言（链接、SDK 成员、kernel 目标、环境变量、
      # 源码路径、CLI 参数、两语言能力表、发布包目录树）。平台无关，跑一次即可。
      - name: Check Docs Against Code
        if: runner.os == 'Linux'
        run: python3 scripts/check_docs.py

      - name: Build Kernel for Native SDK Regression
        run: cargo build --locked

      # 日常门禁：--init 生成变体骨架 → 真实配置文件启动 → 全部域注册 → 探针消息
      # 走完四阶段 → hub_logs 真正落库。发版构建里也有一条同样语义的步骤（用安装包），
      # 这里用源码树提前拦住回归，不必等到打 tag 才发现。
      - name: Boot Smoke Test (--init + --smoke-test)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PYTHONPATH="$(pwd)/sdk/python" ./target/debug/atelier-kernel --init ./ci-smoke
          PYTHONPATH="$(pwd)/sdk/python" ./target/debug/atelier-kernel \
            --config ./ci-smoke/kernel_boot.json --smoke-test
          rm -rf ./ci-smoke

      - name: Run SDK Unit Test Suites
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1; then
            PY_BIN="python3"
          else
            PY_BIN="python"
          fi
          PYTHONPATH=sdk/python $PY_BIN sdk/python/tests/test_domain.py
          node --test sdk/nodejs/tests/domain.test.mjs

      # 类型门禁：把 index.d.ts 当真实包用一遍，能抓到文本比对发现不了的
      # 缺失声明、错误重载（例如 send 对字符串/数组的返回类型）。
      - name: Check Node SDK Types
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --no-audit --no-fund typescript@5
          npx tsc --noEmit --strict --target es2020 --module commonjs \
            --moduleResolution node --skipLibCheck sdk/nodejs/tests/types.consumer.ts

  build-sdk-packages:
    needs: [ci-test]
    name: Build Domain SDKs (Python Wheel & Node.js NPM)
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build Python Wheel (.whl) & Node.js Package (.tgz)
        run: |
          mkdir -p dist/sdk
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          # 发版记录统一归档在 docs/archive/；旧位置仍兼容一次，避免历史 tag 重跑失败。
          notes="docs/archive/RELEASE_${version}.md"
          [ -f "$notes" ] || notes="docs/RELEASE_${version}.md"
          cp "$notes" dist/sdk/RELEASE_NOTES.md
          python3 sdk/python/build_wheel.py dist/sdk
          cd sdk/nodejs && npm pack --pack-destination ../../dist/sdk

      - name: Verify Python Wheel installation
        run: |
          pip install dist/sdk/atelier_sdk-*.whl
          python3 -c "from atelier_sdk import AtelierDomain, __version__; print('Verified Python SDK version:', __version__)"

      - name: Run SDK Unit Test Suites
        run: |
          PYTHONPATH=sdk/python python3 sdk/python/tests/test_domain.py
          node --test sdk/nodejs/tests/domain.test.mjs

      - name: Upload SDK Packages Artifact
        uses: actions/upload-artifact@v7
        with:
          name: atelier-domain-sdks
          path: dist/sdk/*

  build-kernel-runtime:
    needs: [ci-test]
    name: Build Precompiled Kernel Runtime (${{ matrix.target_label }})
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_label: linux-x86_64
            bin_name: atelier-kernel
          - os: windows-latest
            target_label: windows-x86_64
            bin_name: atelier-kernel.exe
          - os: macos-latest
            target_label: macos-arm64
            bin_name: atelier-kernel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Kernel Unit & Integration Tests
        run: cargo test

      - name: Build Release Kernel Binary
        run: cargo build --release

      - name: Assemble Kernel Runtime Bundle
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1; then
            PY_BIN="python3"
          else
            PY_BIN="python"
          fi
          mkdir -p dist/kernel-runtime-${{ matrix.target_label }}
          cp target/release/${{ matrix.bin_name }} dist/kernel-runtime-${{ matrix.target_label }}/
          cp kernel_boot.json dist/kernel-runtime-${{ matrix.target_label }}/kernel_boot.template.json
          # 根目录只有 README；契约、能力、SDK 文档与图标全部随 docs/ 一起打包。
          cp README.md dist/kernel-runtime-${{ matrix.target_label }}/
          cp -R docs dist/kernel-runtime-${{ matrix.target_label }}/docs
          mkdir -p dist/kernel-runtime-${{ matrix.target_label }}/sdk/python dist/kernel-runtime-${{ matrix.target_label }}/sdk/nodejs
          cp sdk/python/README.md dist/kernel-runtime-${{ matrix.target_label }}/sdk/python/README.md
          cp sdk/nodejs/README.md dist/kernel-runtime-${{ matrix.target_label }}/sdk/nodejs/README.md
          $PY_BIN sdk/python/build_wheel.py dist/kernel-runtime-${{ matrix.target_label }}/sdk
          (cd sdk/nodejs && npm pack --pack-destination ../../dist/kernel-runtime-${{ matrix.target_label }}/sdk)
          tar -C dist -czf dist/atelier-kernel-runtime-${{ matrix.target_label }}.tar.gz kernel-runtime-${{ matrix.target_label }}

      - name: End-to-End Variant Smoke Test (--init + --smoke-test)
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1; then
            PY_BIN="python3"
          else
            PY_BIN="python"
          fi
          wheels=(dist/kernel-runtime-${{ matrix.target_label }}/sdk/atelier_sdk-*.whl)
          $PY_BIN -m pip install "${wheels[0]}"
          export PYTHONPATH="$(pwd)/${wheels[0]}"
          ./dist/kernel-runtime-${{ matrix.target_label }}/${{ matrix.bin_name }} --init ./ci-smoke-variant
          ./dist/kernel-runtime-${{ matrix.target_label }}/${{ matrix.bin_name }} --config ./ci-smoke-variant/kernel_boot.json --smoke-test
          rm -rf ./ci-smoke-variant

      - name: Upload Kernel Runtime Artifact (${{ matrix.target_label }})
        uses: actions/upload-artifact@v7
        with:
          name: atelier-kernel-runtime-${{ matrix.target_label }}
          path: dist/atelier-kernel-runtime-${{ matrix.target_label }}.tar.gz

  publish-github-release:
    name: Publish GitHub Release (on v* tag)
    needs: [ci-test, build-sdk-packages, build-kernel-runtime]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*.whl
            release-assets/*.tgz
            release-assets/*.tar.gz
          body_path: release-assets/RELEASE_NOTES.md
          generate_release_notes: true
